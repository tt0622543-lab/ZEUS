<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zeus IA — Avatar LIVE</title>
<style>
:root{--gold:#ffc72c;--gold2:#ff9f0a;--ink:#090a0e;--white:#f7f5ef}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--white)}
body{display:flex;align-items:center;justify-content:center}
.stage{position:relative;width:min(100vw,100vh * .82);height:100vh;max-width:100vw;display:flex;align-items:center;justify-content:center}
.avatar{width:100%;height:100%;max-height:100vh;overflow:visible;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 75%;filter:drop-shadow(0 12px 16px #0008)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-8px) rotate(.5deg)}}
.earL,.earR{transform-box:fill-box;transform-origin:50% 100%;animation:ear 4s ease-in-out infinite}.earR{animation-delay:.4s}@keyframes ear{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-5deg)}96%{transform:rotate(2deg)}}
.eyelid{transform-box:fill-box;transform-origin:center;animation:blink 5.3s infinite}@keyframes blink{0%,43%,46%,78%,100%{transform:scaleY(0)}44%,45%,79%{transform:scaleY(1)}}
.mouth{transform-box:fill-box;transform-origin:50% 0%;transform:scaleY(.12);transition:transform .12s ease}
.talking .mouth{animation:talk .19s infinite alternate}@keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
.talking .head{animation:headtalk .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 90%}@keyframes headtalk{from{transform:rotate(-1deg)}to{transform:rotate(1deg)}}
.brand{position:absolute;top:2.4%;left:50%;transform:translateX(-50%);font-weight:950;letter-spacing:.12em;font-size:clamp(12px,2.6vw,25px);color:var(--gold);text-shadow:0 0 14px #ffae00aa;white-space:nowrap}
.caption{position:absolute;bottom:5%;left:50%;transform:translateX(-50%);max-width:88%;padding:10px 16px;border:1px solid #ffc72c99;border-radius:18px;background:#090a0ee8;color:white;font-weight:750;text-align:center;font-size:clamp(12px,2vw,19px);box-shadow:0 0 18px #ffb00022}
.controls{position:fixed;right:12px;bottom:12px;display:flex;gap:7px;z-index:5;opacity:.18;transition:opacity .2s}.controls:hover{opacity:1}
button{border:1px solid #ffc72c;background:#101116;color:#ffd15b;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}
@media(max-width:480px){.stage{width:100vw}.caption{bottom:4%}}
</style></head>
<body>
<main class="stage" id="stage" aria-label="Zeus IA avatar animado">
<div class="brand">⚡ ZEUS IA</div>
<svg class="avatar" viewBox="0 0 600 760" role="img" aria-label="Bulldog preto e dourado animado">
<defs>
 <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#30313a"/><stop offset=".38" stop-color="#111218"/><stop offset=".72" stop-color="#050609"/><stop offset="1" stop-color="#24242b"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a0"/><stop offset=".35" stop-color="#ffc72c"/><stop offset="1" stop-color="#a65a00"/></linearGradient>
 <radialGradient id="muzzle"><stop stop-color="#3a3435"/><stop offset="1" stop-color="#111116"/></radialGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<!-- shoulders/hoodie -->
<path d="M110 710 Q115 570 205 532 L395 532 Q485 570 490 710Z" fill="#08090d" stroke="url(#gold)" stroke-width="7"/>
<path d="M210 552 L300 630 L390 552" fill="none" stroke="#b67b0b" stroke-width="5"/>
<path d="M270 610 L300 635 L330 610 L317 663 L300 647 L283 663Z" fill="url(#gold)"/>
<!-- ears -->
<g class="head">
<g class="earL"><path d="M174 250 Q106 202 116 92 Q122 27 174 86 Q218 138 227 225Z" fill="url(#fur)" stroke="#050507" stroke-width="9"/><path d="M164 198 Q132 149 139 92 Q169 113 187 207Z" fill="#6e3e46"/></g>
<g class="earR"><path d="M374 225 Q390 126 444 83 Q496 37 500 103 Q507 205 426 258Z" fill="url(#fur)" stroke="#050507" stroke-width="9"/><path d="M411 207 Q445 131 480 94 Q481 154 438 218Z" fill="#6e3e46"/></g>
<!-- headset band -->
<path d="M164 304 Q144 89 300 82 Q458 85 440 304" fill="none" stroke="#090a0e" stroke-width="34"/>
<path d="M164 304 Q144 89 300 82 Q458 85 440 304" fill="none" stroke="url(#gold)" stroke-width="7"/>
<rect x="130" y="248" width="65" height="125" rx="22" fill="#090a0e" stroke="url(#gold)" stroke-width="7"/><path d="M148 275 L176 291 L148 307 L176 323" fill="none" stroke="#ffc72c" stroke-width="5"/>
<rect x="405" y="248" width="65" height="125" rx="22" fill="#090a0e" stroke="url(#gold)" stroke-width="7"/><path d="M424 275 L452 291 L424 307 L452 323" fill="none" stroke="#ffc72c" stroke-width="5"/>
<!-- head -->
<path d="M166 263 Q177 173 300 172 Q423 173 434 263 L421 390 Q407 484 300 508 Q193 484 179 390Z" fill="url(#fur)" stroke="#030407" stroke-width="8"/>
<!-- brows -->
<path d="M192 295 Q229 268 263 296" fill="none" stroke="#07080b" stroke-width="19" stroke-linecap="round"/><path d="M337 296 Q371 268 408 295" fill="none" stroke="#07080b" stroke-width="19" stroke-linecap="round"/>
<!-- eyes -->
<ellipse cx="230" cy="322" rx="35" ry="39" fill="#050609"/><ellipse cx="370" cy="322" rx="35" ry="39" fill="#050609"/>
<ellipse cx="231" cy="322" rx="23" ry="28" fill="#bd7b24"/><ellipse cx="369" cy="322" rx="23" ry="28" fill="#bd7b24"/>
<ellipse cx="231" cy="322" rx="13" ry="21" fill="#050609"/><ellipse cx="369" cy="322" rx="13" ry="21" fill="#050609"/>
<circle cx="239" cy="312" r="7" fill="white"/><circle cx="377" cy="312" r="7" fill="white"/>
<ellipse class="eyelid" cx="230" cy="322" rx="36" ry="39" fill="#17171d"/><ellipse class="eyelid" cx="370" cy="322" rx="36" ry="39" fill="#17171d"/>
<!-- muzzle folds -->
<path d="M300 324 Q270 360 249 363 M300 324 Q330 360 351 363" fill="none" stroke="#050609" stroke-width="15" stroke-linecap="round"/>
<ellipse cx="300" cy="383" rx="111" ry="81" fill="url(#muzzle)"/>
<path d="M201 373 Q219 351 244 366 M399 373 Q381 351 356 366" fill="none" stroke="#4b4548" stroke-width="5" stroke-linecap="round"/>
<!-- nose -->
<path d="M260 365 Q264 342 287 348 L313 348 Q336 342 340 365 Q335 391 300 395 Q265 391 260 365Z" fill="#07080c" stroke="#4a4144" stroke-width="4"/>
<ellipse cx="282" cy="359" rx="9" ry="5" fill="#777078" opacity=".65"/>
<!-- mouth and tongue -->
<g class="mouth">
<path d="M218 401 Q300 437 382 401 Q374 472 300 474 Q226 472 218 401Z" fill="#090407" stroke="#050507" stroke-width="5"/>
<path d="M235 411 Q300 436 365 411 L354 429 Q300 450 246 429Z" fill="#f1e2d5"/>
<path d="M273 447 Q300 432 327 447 Q331 481 300 485 Q269 481 273 447Z" fill="#df5474"/>
<path d="M300 448 L300 477" stroke="#b52f52" stroke-width="3"/>
</g>
<!-- cheek dots -->
<g fill="#6b6061"><circle cx="215" cy="394" r="3"/><circle cx="228" cy="407" r="3"/><circle cx="240" cy="393" r="3"/><circle cx="385" cy="394" r="3"/><circle cx="372" cy="407" r="3"/><circle cx="360" cy="393" r="3"/></g>
<!-- chain -->
<path d="M211 505 Q300 565 389 505" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>
<path d="M238 520 Q300 560 362 520" fill="none" stroke="#ffdf6a" stroke-width="3"/>
<!-- logo tag -->
<path d="M287 540 L313 540 L310 575 L300 588 L290 575Z" fill="url(#gold)"/>
<path d="M300 545 L293 562 L302 560 L298 574 L308 556 L300 558Z" fill="#18130a"/>
</g>
</svg>
<div class="caption" id="caption">Salve, tropa! O Zeus chegou! ⚡</div>
</main>
<div class="controls"><button id="talk">Testar fala</button><button id="stop">Parar</button></div>
<script>
const stage=document.getElementById('stage'), caption=document.getElementById('caption');
const lines=['Salve, tropa! O Zeus chegou! ⚡','Ô meu parceiro, já deixou o like ou veio só fiscalizar? 😂','Aqui é o Zeus, meu consagrado! Respeita o bulldog!','Manda energia pra live, família! Bora movimentar isso aqui!'];
function speak(text){caption.textContent=text;stage.classList.add('talking');
 if(!('speechSynthesis' in window)){caption.textContent=text+' (voz não disponível neste navegador)';setTimeout(()=>stage.classList.remove('talking'),2500);return}
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.rate=1.03;u.pitch=.85;
 const voices=speechSynthesis.getVoices();const v=voices.find(x=>x.lang.toLowerCase().startsWith('pt-br'))||voices.find(x=>x.lang.toLowerCase().startsWith('pt'));if(v)u.voice=v;
 u.onend=()=>stage.classList.remove('talking');u.onerror=()=>stage.classList.remove('talking');speechSynthesis.speak(u);
}
document.getElementById('talk').addEventListener('click',()=>speak(lines[Math.floor(Math.random()*lines.length)]));
document.getElementById('stop').addEventListener('click',()=>{if('speechSynthesis'in window)speechSynthesis.cancel();stage.classList.remove('talking');caption.textContent='Zeus está de olho no chat… 👀'});
speechSynthesis?.getVoices?.();
</script></body></html>
