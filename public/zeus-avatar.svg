<svg class="avatar" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" role="img" aria-labelledby="title desc">
<title id="title">Zeus IA — bulldog francês preto</title>
<desc id="desc">Avatar estilizado de um bulldog francês preto, com olhos âmbar, moletom preto e detalhes dourados.</desc>
<defs>
 <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#55545a"/><stop offset=".24" stop-color="#24252b"/><stop offset=".62" stop-color="#090b10"/><stop offset="1" stop-color="#303039"/></linearGradient>
 <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#9a6267"/><stop offset="1" stop-color="#422c35"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0ae"/><stop offset=".35" stop-color="#f4c34f"/><stop offset=".72" stop-color="#b97818"/><stop offset="1" stop-color="#ffdf82"/></linearGradient>
 <radialGradient id="muzzle"><stop stop-color="#555057"/><stop offset=".62" stop-color="#24232a"/><stop offset="1" stop-color="#101116"/></radialGradient>
 <radialGradient id="eye"><stop stop-color="#ffdc83"/><stop offset=".4" stop-color="#b87924"/><stop offset="1" stop-color="#39200b"/></radialGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<ellipse cx="450" cy="930" rx="300" ry="42" fill="#000" opacity=".5" filter="url(#shadow)"/>
<!-- jacket and shoulders -->
<path d="M118 1000 Q135 820 245 755 Q325 710 450 710 Q575 710 655 755 Q765 820 782 1000Z" fill="#090c12" stroke="url(#gold)" stroke-width="12"/>
<path d="M285 765 Q350 850 450 885 Q550 850 615 765" fill="none" stroke="#34323a" stroke-width="18"/>
<path d="M450 830 L490 878 L450 920 L410 878Z" fill="#11141b" stroke="url(#gold)" stroke-width="9"/>
<path d="M450 845 L432 878 L450 870 L468 878Z" fill="url(#gold)"/>
<!-- ears -->
<path d="M205 370 Q102 295 112 130 Q120 34 213 93 Q292 144 310 320Z" fill="url(#fur)" stroke="#07080c" stroke-width="18"/>
<path d="M174 282 Q138 198 151 104 Q210 146 245 285Z" fill="url(#inner)" opacity=".9"/>
<path d="M695 370 Q798 295 788 130 Q780 34 687 93 Q608 144 590 320Z" fill="url(#fur)" stroke="#07080c" stroke-width="18"/>
<path d="M726 282 Q762 198 749 104 Q690 146 655 285Z" fill="url(#inner)" opacity=".9"/>
<!-- head -->
<path d="M185 350 Q198 210 450 205 Q702 210 715 350 L700 595 Q682 760 450 790 Q218 760 200 595Z" fill="url(#fur)" stroke="#07080c" stroke-width="20"/>
<!-- forehead light -->
<path d="M310 260 Q450 205 590 260 Q525 285 450 280 Q375 285 310 260Z" fill="#8b8990" opacity=".13"/>
<!-- brow ridges -->
<path d="M245 415 Q315 360 395 414" fill="none" stroke="#08090d" stroke-width="36" stroke-linecap="round"/>
<path d="M505 414 Q585 360 655 415" fill="none" stroke="#08090d" stroke-width="36" stroke-linecap="round"/>
<!-- eyes -->
<ellipse cx="330" cy="455" rx="58" ry="65" fill="#050609"/>
<ellipse cx="570" cy="455" rx="58" ry="65" fill="#050609"/>
<ellipse cx="332" cy="455" rx="40" ry="48" fill="url(#eye)"/>
<ellipse cx="568" cy="455" rx="40" ry="48" fill="url(#eye)"/>
<ellipse cx="332" cy="458" rx="20" ry="32" fill="#090a0d"/>
<ellipse cx="568" cy="458" rx="20" ry="32" fill="#090a0d"/>
<circle cx="346" cy="437" r="12" fill="#fff" opacity=".95"/>
<circle cx="582" cy="437" r="12" fill="#fff" opacity=".95"/>
<!-- cheek folds -->
<path d="M450 440 Q412 490 365 505 M450 440 Q488 490 535 505" fill="none" stroke="#08090d" stroke-width="23" stroke-linecap="round"/>
<path d="M228 525 Q270 500 303 523 M672 525 Q630 500 597 523" fill="none" stroke="#77717a" stroke-width="8" opacity=".55" stroke-linecap="round"/>
<!-- muzzle -->
<ellipse cx="450" cy="565" rx="205" ry="145" fill="url(#muzzle)"/>
<path d="M260 545 Q300 510 345 538 M640 545 Q600 510 555 538" fill="none" stroke="#69636c" stroke-width="8" opacity=".65" stroke-linecap="round"/>
<!-- nose -->
<path d="M378 520 Q385 486 420 490 L480 490 Q515 486 522 520 Q515 565 450 572 Q385 565 378 520Z" fill="#08090d" stroke="#5e5961" stroke-width="9"/>
<ellipse cx="415" cy="510" rx="18" ry="9" fill="#9b959d" opacity=".45"/>
<!-- mouth -->
<g class="mouth">
<path d="M305 590 Q450 655 595 590 Q580 700 450 705 Q320 700 305 590Z" fill="#080509" stroke="#090a0e" stroke-width="10"/>
<path d="M325 603 Q450 650 575 603 L555 632 Q450 670 345 632Z" fill="#f0e5dd"/>
<path d="M390 660 Q450 628 510 660 Q510 735 450 740 Q390 735 390 660Z" fill="#d85b79"/>
<path d="M450 660 L450 725" stroke="#a73353" stroke-width="7"/>
</g>
<!-- face highlights -->
<path d="M250 585 Q280 620 305 615 M650 585 Q620 620 595 615" fill="none" stroke="#8a838b" stroke-width="7" opacity=".35" stroke-linecap="round"/>
<!-- chain -->
<path d="M270 765 Q450 875 630 765" fill="none" stroke="url(#gold)" stroke-width="20" stroke-linecap="round"/>
<path d="M300 780 Q450 865 600 780" fill="none" stroke="#fff0b4" stroke-width="5" opacity=".8"/>
<!-- pendant -->
<path d="M410 842 L490 842 L482 925 L450 954 L418 925Z" fill="#10131a" stroke="url(#gold)" stroke-width="9"/>
<path d="M450 858 L430 897 L450 887 L470 897Z" fill="url(#gold)"/>
<!-- tiny crown -->
<path d="M387 300 L405 266 L432 290 L450 250 L468 290 L495 266 L513 300Z" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linejoin="round" opacity=".9"/>
</svg>